<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE394"/>
      <stop offset="35%" stop-color="#E5B558"/>
      <stop offset="70%" stop-color="#C58E2E"/>
      <stop offset="100%" stop-color="#E8BE65"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B558" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C58E2E" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D6A84E" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark rounded squircle base -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>

  <!-- Iconic bold 'O' glyph: perfectly balanced and thick enough for 16px legibility -->
  <path d="M 32 12
           C 42.5 12 50 19.5 50 32
           C 50 44.5 42.5 52 32 52
           C 21.5 52 14 44.5 14 32
           C 14 19.5 21.5 12 32 12 Z
           M 32 20.5
           C 26 20.5 22.5 24.5 22.5 32
           C 22.5 39.5 26 43.5 32 43.5
           C 38 43.5 41.5 39.5 41.5 32
           C 41.5 24.5 38 20.5 32 20.5 Z"
        fill="url(#gold)"
        fill-rule="evenodd"
        filter="url(#glow)"/>

  <!-- Subtle luxury light accent at top-right curve -->
  <circle cx="43.5" cy="20.5" r="2.2" fill="#FFF8DE"/>
</svg>
